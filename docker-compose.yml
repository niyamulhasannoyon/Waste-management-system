services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: clean_savar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clean_savar}
      POSTGRES_USER: ${POSTGRES_USER:-clean_savar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clean_savar_local_only_pw}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clean_savar} -d ${POSTGRES_DB:-clean_savar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: clean_savar_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clean_savar}:${POSTGRES_PASSWORD:-clean_savar_local_only_pw}@postgres:5432/${POSTGRES_DB:-clean_savar}
      APP_ENV: ${APP_ENV:-development}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ALLOW_INSECURE_DEV_DEFAULTS: ${ALLOW_INSECURE_DEV_DEFAULTS:-false}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      ADMIN_BOOTSTRAP_PHONES: ${ADMIN_BOOTSTRAP_PHONES:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      API_BIND_ADDR: 0.0.0.0:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      UPLOAD_DIR: /app/uploads
      PUBLIC_UPLOAD_BASE_URL: ${PUBLIC_UPLOAD_BASE_URL:-http://localhost:8080/uploads}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      COMPLAINT_DUPLICATE_RADIUS_METERS: ${COMPLAINT_DUPLICATE_RADIUS_METERS:-50}
      WORKERS_NEARBY_DEFAULT_RADIUS_METERS: ${WORKERS_NEARBY_DEFAULT_RADIUS_METERS:-5000}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: clean_savar_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  pg_data:
  uploads_data:
