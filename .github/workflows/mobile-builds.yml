name: Clean Savar Mobile Builds (Android APK & iOS IPA)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional backend API base URL baked into the builds"
        required: false
        default: "http://10.0.2.2:8080/api/v1"
        type: string
      enable_demo_mode:
        description: "Include offline Citizen & Collector demo preview buttons in release builds"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/clean_savar_core/**"
      - ".github/workflows/mobile-builds.yml"

jobs:
  android-apk:
    name: Build Android Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies & verify tests
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build size-optimized split APKs
        working-directory: apps/mobile
        run: |
          API_URL="${{ inputs.api_base_url || 'http://10.0.2.2:8080/api/v1' }}"
          DEMO_MODE="${{ inputs.enable_demo_mode != false && 'true' || 'false' }}"
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=ENABLE_DEMO_MODE="$DEMO_MODE"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clean-savar-android-apks
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

  ios-ipa:
    name: Build iOS Unsigned IPA (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies & CocoaPods
        working-directory: apps/mobile
        run: |
          flutter pub get
          cd ios
          pod install --repo-update || pod install

      - name: Build iOS release app (unsigned)
        working-directory: apps/mobile
        run: |
          API_URL="${{ inputs.api_base_url || 'http://10.0.2.2:8080/api/v1' }}"
          DEMO_MODE="${{ inputs.enable_demo_mode != false && 'true' || 'false' }}"
          flutter build ios --release \
            --no-codesign \
            --obfuscate \
            --split-debug-info=build/ios/symbols \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=ENABLE_DEMO_MODE="$DEMO_MODE"

      - name: Package CleanSavar-ios-unsigned.ipa
        working-directory: apps/mobile
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry CleanSavar-ios-unsigned.ipa Payload
          ls -lh CleanSavar-ios-unsigned.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-savar-ios-ipa
          path: apps/mobile/build/ios/ipa/CleanSavar-ios-unsigned.ipa
          retention-days: 30
