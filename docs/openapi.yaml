openapi: 3.0.3
info:
  title: Clean Savar (ক্লিন সাভার) API
  version: 0.2.0
  description: >
    Municipal waste management REST API for Savar Pourashava (Wards 1-9) and
    surrounding unions (101-106), backed by PostgreSQL + PostGIS.
servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker / Cargo development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, message_bn]
          properties:
            code:
              type: string
            message:
              type: string
            message_bn:
              type: string
    OtpChallengeRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          example: "01715-883210"
        role:
          type: string
          enum: [citizen, partner]
        full_name:
          type: string
        ward_id:
          type: integer
    OtpVerifyRequest:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string
    PickupCreateRequest:
      type: object
      required: [ward_id, address_line, waste_type, slot, estimated_bags]
      properties:
        citizen_name:
          type: string
        citizen_phone:
          type: string
        ward_id:
          type: integer
        address_line:
          type: string
        landmark:
          type: string
        waste_type:
          type: string
          enum: [household, organic, recyclable, bulky]
        slot:
          type: string
          enum: [morning, afternoon, evening]
        schedule_type:
          type: string
          enum: [one_time, recurring_weekly]
        preferred_day:
          type: string
          nullable: true
        estimated_bags:
          type: integer
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        notes:
          type: string
    ReportCreateRequest:
      type: object
      required: [ward_id, title_bn, landmark, severity, lat, lng]
      properties:
        reporter_name:
          type: string
        reporter_phone:
          type: string
        ward_id:
          type: integer
        title_bn:
          type: string
        landmark:
          type: string
        severity:
          type: string
          enum: [medium, high, critical]
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        photo_urls:
          type: array
          items:
            type: string
    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
    VehicleLocationRequest:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        on_duty:
          type: boolean
    DispatchAssignRequest:
      type: object
      required: [entity_type, entity_id, vehicle_id]
      properties:
        entity_type:
          type: string
          enum: [pickup, dump_report]
        entity_id:
          type: string
          format: uuid
        vehicle_id:
          type: string
          format: uuid
    CollectorCompleteRequest:
      type: object
      required: [task_type, weight_kg]
      properties:
        task_type:
          type: string
          enum: [pickup, dump_report]
        weight_kg:
          type: number
          format: double
        completion_photo_url:
          type: string
        notes:
          type: string
    NotificationRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title_bn:
          type: string
        body_bn:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
paths:
  /health:
    get:
      summary: Health & PostGIS readiness check
      responses:
        "200":
          description: Service healthy
  /auth/otp-login:
    post:
      summary: Request OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpChallengeRequest"
      responses:
        "200":
          description: OTP issued
        "429":
          description: Cooldown or rate limit exceeded
  /auth/otp-verify:
    post:
      summary: Verify OTP and establish session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: Authenticated session returned
        "401":
          description: Invalid or expired OTP
  /auth/firebase-login:
    post:
      summary: Verify Firebase ID token and establish session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                full_name:
                  type: string
                ward_id:
                  type: integer
                role:
                  type: string
      responses:
        "200":
          description: Authenticated session returned
        "401":
          description: Invalid or expired Firebase token
        "429":
          description: Rate limit exceeded
  /auth/me:
    get:
      summary: Fetch authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active user profile
        "401":
          description: Unauthorized
  /auth/logout:
    post:
      summary: Revoke active session token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
  /auth/erase:
    post:
      summary: Anonymize authenticated user PII and revoke sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account anonymized
        "403":
          description: Admin self-erasure disallowed
  /admin/retention/purge:
    post:
      summary: Execute expired transient token cleanup and retention anonymization (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: retention_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 30
            maximum: 3650
      responses:
        "200":
          description: Purge counts returned
        "403":
          description: Admin role required
  /wards:
    get:
      summary: List canonical Savar wards and unions
      responses:
        "200":
          description: Ward array returned
        "304":
          description: Not Modified (ETag match)
  /wards/resolve:
    get:
      summary: Resolve latitude/longitude to Savar ward or union
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Resolved ward
  /analytics/public:
    get:
      summary: Public municipal waste analytics summary
      responses:
        "200":
          description: Aggregated metrics
  /analytics/summary:
    get:
      summary: Admin operational summary (Asia/Dhaka midnight boundary)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operational metrics
        "403":
          description: Admin role required
  /pickups:
    get:
      summary: List role-scoped pickup requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pickup request list
    post:
      summary: Create a pickup request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupCreateRequest"
      responses:
        "201":
          description: Pickup request created
  /pickups/track/{code}:
    get:
      summary: Track a pickup request by tracking code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tracking record (PII redacted unless owner/authorized)
        "404":
          description: Not found
        "429":
          description: Rate limit exceeded
  /pickups/{id}/status:
    patch:
      summary: Update pickup status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequest"
      responses:
        "200":
          description: Status updated
  /reports/public:
    get:
      summary: List public sanitized illegal dumping hotspots
      responses:
        "200":
          description: Hotspot list
  /reports:
    get:
      summary: List role-scoped illegal dumping reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dump report list
    post:
      summary: Submit an illegal dumping report (50m duplicate clustering)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreateRequest"
      responses:
        "201":
          description: Report created
  /reports/track/{code}:
    get:
      summary: Track a dump report by tracking code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tracking record (PII redacted unless owner/authorized)
        "404":
          description: Not found
  /reports/{id}/status:
    patch:
      summary: Update dump report status and notify clustered reporters
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequest"
      responses:
        "200":
          description: Status updated
  /dispatch/vehicles:
    get:
      summary: List collection vehicles (collector own vehicle or admin all)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vehicle list
  /dispatch/vehicles/{id}/location:
    patch:
      summary: Update vehicle location & duty state
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleLocationRequest"
      responses:
        "200":
          description: Location updated
  /dispatch/assign:
    post:
      summary: Assign pickup or dump report to a collection vehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchAssignRequest"
      responses:
        "200":
          description: Assignment persisted
  /workers/nearby:
    get:
      summary: PostGIS ST_DWithin lookup of nearby active collection vehicles
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Nearby vehicles returned
        "403":
          description: Admin role required
  /collector/tasks/{id}/complete:
    patch:
      summary: Complete assigned pickup or dump report task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectorCompleteRequest"
      responses:
        "200":
          description: Task marked completed
    post:
      summary: Complete assigned pickup or dump report task (POST alias)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectorCompleteRequest"
      responses:
        "200":
          description: Task marked completed
  /collector/sync:
    post:
      summary: Batch-sync offline collector task completions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sync summary returned
  /partner/lots:
    get:
      summary: List recyclable material lots
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recyclable lot list
    post:
      summary: Publish recyclable material lot (admin)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Lot created
  /partner/lots/{id}/claim:
    post:
      summary: Claim open recyclable lot (partner/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lot claimed
  /partner/lots/{id}/collect:
    post:
      summary: Record lot collection weight & close lot
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lot collected
  /notifications:
    get:
      summary: List authenticated user notifications
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notifications list
  /notifications/{id}/read:
    patch:
      summary: Mark notification read and return updated record
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRecord"
  /uploads/photo:
    post:
      summary: Upload photo (multipart field "photo", magic-byte & dimension verified, EXIF stripped)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded image URL returned
        "413":
          description: Image exceeds MAX_UPLOAD_BYTES
        "422":
          description: Unsupported media type or invalid dimensions
