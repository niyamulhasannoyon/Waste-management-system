publish_to: 'none'
version: 2.0.0+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  clean_savar_core:
    path: ../../packages/clean_savar_core
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.6
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
